name: collect-oi

# Triggered externally every 5 minutes by cron-job.org via the
# workflow-dispatch API. GitHub-native schedule is intentionally NOT used
# here — its free-tier cron drops events under load (we observed only
# ~1 fire per hour), so all scheduling lives outside GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect snapshot
        run: python collect.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oi/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "oi: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # Retry-loop on push: someone else (the picker, or an earlier
            # delayed cron) may have pushed in the meantime.
            for i in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} || true
              if git push; then
                echo "Pushed on attempt $i."
                break
              fi
              echo "Push attempt $i failed; retrying in 5s."
              sleep 5
            done
          fi
